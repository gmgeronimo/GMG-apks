name: Edge Light (APK)

on:
  push:
    paths: ["EdgeLight/**", ".github/workflows/edgelight.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EdgeLight
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Preparar fontes (Mona Sans e Nunito, licença OFL)
        run: |
          npm install --no-save --prefix /tmp/fontes @fontsource/nunito@5.3.0 @fontsource/mona-sans@5.3.0
          pip install fonttools brotli
          python3 tools/fontes.py /tmp/fontes/node_modules/@fontsource app/src/main/res/font

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: EdgeLight-apk
          path: EdgeLight/app/build/outputs/apk/debug/app-debug.apk
